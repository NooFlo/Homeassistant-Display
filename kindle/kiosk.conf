# Upstart job: open the dashboard in the stock browser at boot and
# start the power-management engine.
#
# Installed to /etc/upstart/kiosk.conf on the Kindle.

start on started frameworkd
stop on stopping frameworkd

exec /bin/sh -c '
  while ! wget -q -O /dev/null http://SERVER_IP:SERVER_PORT/health 2>/dev/null; do
    sleep 5
  done
  lipc-set-prop com.lab126.powerd preventScreenSaver 1
  lipc-set-prop -i com.lab126.appmgrd start app://web-reader "{\"url\":\"http://SERVER_IP:SERVER_PORT/\"}"
'
