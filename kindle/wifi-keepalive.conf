# Upstart job: keep the WiFi association from idling out while the
# device is awake (the AP or the firmware may otherwise drop it).

start on started frameworkd
stop on stopping frameworkd

exec /bin/sh -c '
  GATEWAY=$(ip route | awk "/default/ {print \$3; exit}")
  while true; do
    ping -c 1 -W 2 "$GATEWAY" >/dev/null 2>&1
    sleep 45
  done
'
